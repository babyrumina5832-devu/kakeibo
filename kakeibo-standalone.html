<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>家計簿</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22%E5%AE%B6%E8%A8%88%E7%B0%BF%22,%22display%22:%22standalone%22,%22background_color%22:%22%23FAFAF8%22,%22theme_color%22:%22%233E5C58%22}" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />
<style>
  html, body { margin:0; padding:0; background:#FAFAF8; }
  * { box-sizing: border-box; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* =========================================================
   自動読み取りは Netlify Functions 経由で行います。
   APIキーはこのファイルには一切含まれません（安全）。
   ========================================================= */

// ---------- Constants ----------
const DEFAULT_CATEGORIES = [
  { id: "food", name: "食費", budget: 25000, color: "#6E8B74" },
  { id: "eatout", name: "外食費", budget: 20000, color: "#C99A4B" },
  { id: "social", name: "交際費", budget: 24000, color: "#B27080" },
  { id: "daily", name: "日用品", budget: 8000, color: "#9A968A" },
  { id: "transport", name: "交通費", budget: 8000, color: "#4C6B85" },
  { id: "medical", name: "医療費", budget: 5000, color: "#A16B63" },
  { id: "beauty", name: "服・美容", budget: 14000, color: "#8478A0" },
  { id: "hobby", name: "趣味", budget: 10000, color: "#4F8585" },
];
const DEFAULT_FIXED = [
  { id: "rent", name: "家賃", amount: 57519 },
  { id: "eikaiwa", name: "英会話", amount: 6014 },
  { id: "net", name: "ネット", amount: 4070 },
  { id: "elec", name: "電気", amount: 3000 },
  { id: "gas", name: "ガス", amount: 3000 },
  { id: "tax", name: "市民税", amount: 14900 },
];

const INK = "#262624", MUTED = "#8B8880", BORDER = "#E7E5E0", BG = "#FAFAF8";
const SURFACE = "#FFFFFF", ACCENT = "#3E5C58", ACCENT_SOFT = "#EDF2F1", WARN = "#B5615A";
const SERIF = "'Shippori Mincho', serif", SANS = "'Zen Kaku Gothic New', sans-serif";

const yen = (n) => `¥${Math.round(n).toLocaleString("ja-JP")}`;
const monthKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const monthLabel = (key) => { const [y, m] = key.split("-"); return `${y}年${parseInt(m, 10)}月`; };

// ---------- Storage (localStorage, replaces Claude's window.storage) ----------
async function loadJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}
async function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) { console.error("storage save failed", key, e); }
}

// ---------- Minimal inline icons ----------
const Icon = ({ children, size = 18, color = "currentColor", strokeWidth = 1.8, className }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const IconCamera = (p) => <Icon {...p}><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="3.6"/></Icon>;
const IconHome = (p) => <Icon {...p}><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/></Icon>;
const IconList = (p) => <Icon {...p}><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><line x1="4" y1="7" x2="4" y2="7"/><line x1="4" y1="12" x2="4" y2="12"/><line x1="4" y1="17" x2="4" y2="17"/></Icon>;
const IconSettings = (p) => <Icon {...p}><line x1="5" y1="6" x2="19" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="5" y1="12" x2="19" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="5" y1="18" x2="19" y2="18"/><circle cx="10" cy="18" r="2"/></Icon>;
const IconX = (p) => <Icon {...p}><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M5 13l4 4L19 7"/></Icon>;
const IconPlus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const IconTrash = (p) => <Icon {...p}><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></Icon>;
const IconPen = (p) => <Icon {...p}><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></Icon>;
const IconLoader = ({ size = 18, className = "" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" className={`spin ${className}`}>
    <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="2.2" strokeOpacity="0.25"/>
    <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"/>
  </svg>
);

// ---------- Toast ----------
function SavedToast({ show }) {
  if (!show) return null;
  return (
    <div style={{ position: "fixed", top: 18, left: "50%", transform: "translateX(-50%)", zIndex: 100,
      background: INK, color: "#FAFAF8", padding: "10px 20px", borderRadius: 999, fontFamily: SANS,
      fontSize: 13, fontWeight: 500, display: "flex", alignItems: "center", gap: 8,
      opacity: 0, animation: "toastIn 1.8s ease forwards", boxShadow: "0 6px 20px rgba(0,0,0,0.18)" }}>
      <IconCheck size={14} /> 記録しました
      <style>{`@keyframes toastIn {0%{opacity:0;transform:translate(-50%,-6px);}12%{opacity:1;transform:translate(-50%,0);}80%{opacity:1;transform:translate(-50%,0);}100%{opacity:0;transform:translate(-50%,-6px);}}`}</style>
    </div>
  );
}

// ---------- Ring ----------
function RingProgress({ ratio, color, size = 116, stroke = 9, children }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, pct = Math.min(1, ratio);
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={ACCENT_SOFT} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - pct)}
          style={{ transition: "stroke-dashoffset 0.5s ease" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        {children}
      </div>
    </div>
  );
}

// ---------- Main App ----------
function Kakeicho() {
  const [view, setView] = useState("home");
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [fixed, setFixed] = useState(DEFAULT_FIXED);
  const [expenses, setExpenses] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [currentMonth, setCurrentMonth] = useState(monthKey());
  const [toast, setToast] = useState(false);

  useEffect(() => {
    (async () => {
      const budgets = await loadJSON("budgets", null);
      if (budgets) { setCategories(budgets.categories || DEFAULT_CATEGORIES); setFixed(budgets.fixed || DEFAULT_FIXED); }
      else await saveJSON("budgets", { categories: DEFAULT_CATEGORIES, fixed: DEFAULT_FIXED });
      setExpenses(await loadJSON("expenses", []));
      setLoaded(true);
    })();
  }, []);

  const persistBudgets = useCallback(async (cats, fx) => {
    setCategories(cats); setFixed(fx); await saveJSON("budgets", { categories: cats, fixed: fx });
  }, []);

  const addExpense = useCallback(async (entry) => {
    const next = [{ ...entry, id: `${Date.now()}-${Math.random().toString(36).slice(2,7)}` }, ...expenses];
    setExpenses(next); await saveJSON("expenses", next);
    setToast(true); setTimeout(() => setToast(false), 1800);
  }, [expenses]);

  const deleteExpense = useCallback(async (id) => {
    const next = expenses.filter((e) => e.id !== id);
    setExpenses(next); await saveJSON("expenses", next);
  }, [expenses]);

  const monthExpenses = expenses.filter((e) => e.date.slice(0, 7) === currentMonth);

  if (!loaded) return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: BG, color: MUTED }}><IconLoader size={22} /></div>;

  return (
    <div style={{ minHeight: "100vh", background: BG, fontFamily: SANS, color: INK, display: "flex", flexDirection: "column" }}>
      <SavedToast show={toast} />
      <Header currentMonth={currentMonth} setCurrentMonth={setCurrentMonth} />
      <div style={{ flex: 1, overflowY: "auto", paddingBottom: 90 }}>
        {view === "home" && <HomeView categories={categories} fixed={fixed} monthExpenses={monthExpenses} />}
        {view === "record" && <RecordView categories={categories} onSave={addExpense} />}
        {view === "history" && <HistoryView categories={categories} expenses={expenses} currentMonth={currentMonth} onDelete={deleteExpense} />}
        {view === "settings" && <SettingsView categories={categories} fixed={fixed} onSave={persistBudgets} />}
      </div>
      <BottomNav view={view} setView={setView} />
    </div>
  );
}

function Header({ currentMonth, setCurrentMonth }) {
  const shift = (delta) => { const [y, m] = currentMonth.split("-").map(Number); const d = new Date(y, m - 1 + delta, 1); setCurrentMonth(monthKey(d)); };
  return (
    <div style={{ padding: "22px 22px 16px", borderBottom: `1px solid ${BORDER}`, background: SURFACE }}>
      <div style={{ fontFamily: SERIF, fontWeight: 600, fontSize: 20, letterSpacing: "0.04em", color: INK }}>家計簿</div>
      <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 14 }}>
        <button onClick={() => shift(-1)} style={arrowBtn}>‹</button>
        <div style={{ fontSize: 14, color: MUTED, minWidth: 90, textAlign: "center" }}>{monthLabel(currentMonth)}</div>
        <button onClick={() => shift(1)} style={arrowBtn}>›</button>
      </div>
    </div>
  );
}
const arrowBtn = { background: "transparent", border: "none", color: MUTED, fontSize: 20, cursor: "pointer", lineHeight: 1, padding: "2px 4px" };

function BottomNav({ view, setView }) {
  const items = [
    { key: "home", label: "ホーム", Icon: IconHome },
    { key: "record", label: "記録", Icon: IconCamera },
    { key: "history", label: "履歴", Icon: IconList },
    { key: "settings", label: "設定", Icon: IconSettings },
  ];
  return (
    <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", background: SURFACE, borderTop: `1px solid ${BORDER}`, paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
      {items.map(({ key, label, Icon: I }) => {
        const active = view === key;
        return (
          <button key={key} onClick={() => setView(key)} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, padding: "11px 0 9px", background: "transparent", border: "none", color: active ? ACCENT : "#B7B4A9", cursor: "pointer" }}>
            <I size={19} strokeWidth={active ? 2.2 : 1.6} />
            <span style={{ fontSize: 10.5, fontWeight: active ? 700 : 400 }}>{label}</span>
          </button>
        );
      })}
    </div>
  );
}

function HomeView({ categories, fixed, monthExpenses }) {
  const spentByCategory = (id) => monthExpenses.filter((e) => e.category === id).reduce((s, e) => s + e.amount, 0);
  const variableBudget = categories.reduce((s, c) => s + c.budget, 0);
  const variableSpent = monthExpenses.reduce((s, e) => s + e.amount, 0);
  const fixedTotal = fixed.reduce((s, f) => s + f.amount, 0);
  const overallRatio = variableBudget > 0 ? variableSpent / variableBudget : 0;
  const over = variableSpent > variableBudget;
  return (
    <div style={{ padding: "22px 20px 4px" }}>
      <div style={{ background: SURFACE, border: `1px solid ${BORDER}`, borderRadius: 16, padding: "22px 20px", marginBottom: 24, display: "flex", alignItems: "center", gap: 20 }}>
        <RingProgress ratio={overallRatio} color={over ? WARN : ACCENT}>
          <div style={{ fontFamily: SERIF, fontSize: 18, fontWeight: 600, color: over ? WARN : INK }}>{Math.round(overallRatio * 100)}%</div>
        </RingProgress>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: MUTED, marginBottom: 4 }}>変動費 使用済み</div>
          <div style={{ fontFamily: SERIF, fontSize: 24, fontWeight: 600, color: INK, marginBottom: 6 }}>{yen(variableSpent)}</div>
          <div style={{ fontSize: 12, color: over ? WARN : MUTED }}>{over ? `予算超過 ${yen(variableSpent - variableBudget)}` : `残り ${yen(variableBudget - variableSpent)}`}</div>
          <div style={{ fontSize: 11.5, color: "#B7B4A9", marginTop: 6 }}>固定費 {yen(fixedTotal)}（自動計上）</div>
        </div>
      </div>
      <div style={{ fontSize: 12, color: MUTED, margin: "0 2px 12px" }}>カテゴリ別</div>
      <div style={{ display: "flex", flexDirection: "column" }}>
        {categories.map((c, i) => {
          const spent = spentByCategory(c.id), ratio = c.budget > 0 ? spent / c.budget : 0, catOver = spent > c.budget;
          return (
            <div key={c.id} style={{ padding: "14px 2px", borderBottom: i < categories.length - 1 ? `1px solid ${BORDER}` : "none" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                  <span style={{ width: 7, height: 7, borderRadius: "50%", background: c.color, display: "inline-block" }} />
                  <span style={{ fontSize: 14 }}>{c.name}</span>
                </div>
                <div style={{ fontSize: 13.5, color: catOver ? WARN : INK }}>{yen(spent)} <span style={{ color: "#B7B4A9" }}>/ {yen(c.budget)}</span></div>
              </div>
              <div style={{ height: 3, background: ACCENT_SOFT, borderRadius: 2, overflow: "hidden" }}>
                <div style={{ width: `${Math.min(100, ratio * 100)}%`, height: "100%", background: catOver ? WARN : c.color, transition: "width 0.3s ease" }} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function RecordView({ categories, onSave }) {
  const fileInputRef = useRef(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [error, setError] = useState("");
  const [form, setForm] = useState(null);
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  const openManual = () => { setError(""); setForm({ store: "", amount: "", category: categories[0]?.id || "", date: today(), items: "" }); };

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setError(""); setAnalyzing(true);
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const mediaType = file.type || "image/jpeg";
      const response = await fetch("/.netlify/functions/analyze-receipt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          imageBase64: base64,
          mediaType,
          categories: categories.map((c) => c.name),
        }),
      });
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      const textBlock = (data.content || []).find((b) => b.type === "text");
      const raw = (textBlock?.text || "").replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(raw);
      const matchedCat = categories.find((c) => c.name === parsed.category)?.id || categories[0]?.id || "";
      const itemsText = Array.isArray(parsed.items) ? parsed.items.filter(Boolean).join("\n") : "";
      setForm({ store: parsed.store || "", amount: parsed.amount ? String(parsed.amount) : "", category: matchedCat, date: today(), items: itemsText });
    } catch (err) {
      console.error(err);
      setError("読み取りに失敗しました。手入力で記録してください。");
      setForm({ store: "", amount: "", category: categories[0]?.id || "", date: today(), items: "" });
    } finally {
      setAnalyzing(false);
      if (fileInputRef.current) fileInputRef.current.value = "";
    }
  };

  const submit = async () => {
    const amount = parseInt(form.amount, 10);
    if (!amount || amount <= 0) { setError("金額を正しく入力してください"); return; }
    await onSave({ store: form.store || "(店名なし)", amount, category: form.category, date: form.date, items: form.items || "" });
    setForm(null);
  };

  if (form) {
    return (
      <div style={{ padding: "22px 20px" }}>
        <div style={{ background: SURFACE, border: `1px solid ${BORDER}`, borderRadius: 16, padding: 22 }}>
          <div style={{ fontFamily: SERIF, fontSize: 16, marginBottom: 18, color: INK }}>内容を確認</div>
          <Field label="店名"><input value={form.store} onChange={(e) => setForm({ ...form, store: e.target.value })} style={inputStyle} placeholder="店名" /></Field>
          <Field label="金額"><input type="number" inputMode="numeric" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} style={inputStyle} placeholder="0" /></Field>
          <Field label="カテゴリ">
            <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })} style={inputStyle}>
              {categories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          <Field label="購入品（1行に1つ）">
            <textarea value={form.items} onChange={(e) => setForm({ ...form, items: e.target.value })} style={{ ...inputStyle, resize: "vertical", minHeight: 72, lineHeight: 1.6 }} placeholder={"例）\nにんじん\n牛乳\n卵"} rows={3} />
          </Field>
          <Field label="日付"><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={inputStyle} /></Field>
          {error && <div style={{ color: WARN, fontSize: 12.5, marginBottom: 12 }}>{error}</div>}
          <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
            <button onClick={() => setForm(null)} style={secondaryBtn}><IconX size={15} /> やめる</button>
            <button onClick={submit} style={primaryBtn}><IconCheck size={15} /> 記録する</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ padding: "22px 20px", display: "flex", flexDirection: "column", gap: 12 }}>
      <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: "none" }} />
      <button onClick={() => fileInputRef.current?.click()} disabled={analyzing} style={{ background: ACCENT, color: "#FAFAF8", border: "none", borderRadius: 16, padding: "40px 18px", display: "flex", flexDirection: "column", alignItems: "center", gap: 12, fontFamily: SERIF, fontSize: 15, cursor: "pointer" }}>
        {analyzing ? <IconLoader size={26} /> : <IconCamera size={26} strokeWidth={1.6} />}
        {analyzing ? "読み取り中…" : "レシートを撮影して記録"}
      </button>
      <button onClick={openManual} style={secondaryBtnFull}><IconPen size={15} /> 手入力で記録する</button>
      {error && <div style={{ color: WARN, fontSize: 12.5 }}>{error}</div>}
      <div style={{ fontSize: 11.5, color: "#B7B4A9", lineHeight: 1.7, padding: "6px 2px" }}>撮影すると店名・金額・カテゴリを自動で読み取り、確認してから記録します。</div>
    </div>
  );
}

function Field({ label, children }) {
  return <div style={{ marginBottom: 14 }}><div style={{ fontSize: 11.5, color: MUTED, marginBottom: 6 }}>{label}</div>{children}</div>;
}

const inputStyle = { width: "100%", boxSizing: "border-box", padding: "10px 12px", border: `1px solid ${BORDER}`, borderRadius: 8, fontSize: 14.5, background: BG, fontFamily: SANS, color: INK };
const primaryBtn = { flex: 1, background: ACCENT, color: "#FAFAF8", border: "none", borderRadius: 10, padding: "12px 0", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 14, fontWeight: 500, cursor: "pointer" };
const secondaryBtn = { flex: 1, background: "transparent", color: MUTED, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "12px 0", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 14, cursor: "pointer" };
const secondaryBtnFull = { ...secondaryBtn, flex: "none", padding: "14px 0" };

function HistoryView({ categories, expenses, currentMonth, onDelete }) {
  const monthExpenses = expenses.filter((e) => e.date.slice(0, 7) === currentMonth).sort((a, b) => (a.date < b.date ? 1 : -1));
  const catMap = Object.fromEntries(categories.map((c) => [c.id, c]));
  if (monthExpenses.length === 0) return <div style={{ padding: "60px 20px", textAlign: "center", color: "#B7B4A9", fontSize: 13 }}>{monthLabel(currentMonth)}の記録はまだありません</div>;
  return (
    <div style={{ padding: "18px 20px" }}>
      {monthExpenses.map((e, i) => {
        const cat = catMap[e.category];
        return (
          <div key={e.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "13px 2px", borderBottom: i < monthExpenses.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <div>
              <div style={{ fontSize: 14 }}>{e.store}</div>
              <div style={{ fontSize: 11, color: "#B7B4A9", display: "flex", gap: 6, alignItems: "center", marginTop: 3 }}>
                <span style={{ width: 6, height: 6, borderRadius: "50%", background: cat?.color || "#999", display: "inline-block" }} />
                {cat?.name || "未分類"} ・ {e.date.slice(5).replace("-", "/")}
              </div>
              {e.items && <div style={{ fontSize: 11.5, color: MUTED, marginTop: 5, whiteSpace: "pre-line", lineHeight: 1.5 }}>{e.items}</div>}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ fontSize: 14.5 }}>{yen(e.amount)}</div>
              <button onClick={() => onDelete(e.id)} style={{ background: "none", border: "none", color: "#C9AFAF", cursor: "pointer" }}><IconTrash size={15} /></button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SettingsView({ categories, fixed, onSave }) {
  const [cats, setCats] = useState(categories);
  const [fx, setFx] = useState(fixed);
  const [saved, setSaved] = useState(false);
  const updateCat = (id, budget) => setCats(cats.map((c) => (c.id === id ? { ...c, budget: parseInt(budget, 10) || 0 } : c)));
  const updateFx = (id, amount) => setFx(fx.map((f) => (f.id === id ? { ...f, amount: parseInt(amount, 10) || 0 } : f)));
  const addFx = () => setFx([...fx, { id: `fx-${Date.now()}`, name: "新しい固定費", amount: 0 }]);
  const removeFx = (id) => setFx(fx.filter((f) => f.id !== id));
  const renameFx = (id, name) => setFx(fx.map((f) => (f.id === id ? { ...f, name } : f)));
  const save = async () => { await onSave(cats, fx); setSaved(true); setTimeout(() => setSaved(false), 1500); };
  return (
    <div style={{ padding: "22px 20px" }}>
      <div style={{ fontFamily: SERIF, fontSize: 15, margin: "2px 0 14px", color: INK }}>変動費の予算</div>
      <div style={{ display: "flex", flexDirection: "column", marginBottom: 26 }}>
        {cats.map((c, i) => (
          <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 0", borderBottom: i < cats.length - 1 ? `1px solid ${BORDER}` : "none" }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", background: c.color }} />
            <div style={{ flex: 1, fontSize: 14 }}>{c.name}</div>
            <input type="number" value={c.budget} onChange={(e) => updateCat(c.id, e.target.value)} style={{ ...inputStyle, width: 108 }} />
          </div>
        ))}
      </div>
      <div style={{ fontFamily: SERIF, fontSize: 15, margin: "2px 0 14px", color: INK }}>固定費（毎月自動計上）</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
        {fx.map((f) => (
          <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <input value={f.name} onChange={(e) => renameFx(f.id, e.target.value)} style={{ ...inputStyle, flex: 1 }} />
            <input type="number" value={f.amount} onChange={(e) => updateFx(f.id, e.target.value)} style={{ ...inputStyle, width: 100 }} />
            <button onClick={() => removeFx(f.id)} style={{ background: "none", border: "none", color: "#C9AFAF", cursor: "pointer" }}><IconTrash size={15} /></button>
          </div>
        ))}
      </div>
      <button onClick={addFx} style={{ ...secondaryBtnFull, marginBottom: 22 }}><IconPlus size={15} /> 固定費を追加</button>
      <button onClick={save} style={{ ...primaryBtn, width: "100%" }}><IconCheck size={15} /> {saved ? "保存しました" : "保存する"}</button>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Kakeicho />);
</script>
</body>
</html>
